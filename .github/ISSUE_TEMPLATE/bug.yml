name: 🐞 Signaler un problème
description: Quelque chose ne fonctionne pas comme prévu (logiciel Windows ou application Android).
labels: ["bug", "bêta"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de tester Airsoft Planner ! Plus la description est précise, plus la correction sera rapide.
        Sans compte GitHub, utilisez plutôt le formulaire : menu « ⋯ » › Donner mon avis.
  - type: dropdown
    id: plateforme
    attributes:
      label: Où ?
      options:
        - Logiciel Windows
        - Application Android
        - Les deux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Menu « ⋯ » › À propos (logiciel) ou bas de l'écran (application).
      placeholder: "0.9.3"
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Que s'est-il passé ?
      description: Ce que vous avez fait, ce que vous attendiez, ce qui s'est passé. Une capture d'écran aide beaucoup.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Comment le reproduire ?
      placeholder: |
        1. Ouvrir l'onglet…
        2. Cliquer sur…
        3. …
